<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" style="background: transparent;">
  <defs>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feFlood flood-color="#ffd54f" flood-opacity="0.6" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="obsidianVelvet" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a1b3d" />
      <stop offset="60%" stop-color="#150d20" />
      <stop offset="100%" stop-color="#09050e" />
    </radialGradient>

    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff275" />
      <stop offset="35%" stop-color="#ffd54f" />
      <stop offset="75%" stop-color="#d49e1e" />
      <stop offset="100%" stop-color="#8c6109" />
    </linearGradient>

    <linearGradient id="silverFiligree" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#c9bfe3" />
      <stop offset="100%" stop-color="#8f80b5" />
    </linearGradient>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="128" cy="128" r="116" fill="none" stroke="#ffd54f" stroke-width="6" opacity="0.4" filter="url(#goldGlow)" />

  <!-- Obsidian Medallion Base -->
  <circle cx="128" cy="128" r="110" fill="url(#obsidianVelvet)" stroke="url(#goldPlate)" stroke-width="7" />

  <!-- Inner Silver Filigree Ring -->
  <circle cx="128" cy="128" r="96" fill="none" stroke="url(#silverFiligree)" stroke-width="2.5" opacity="0.6" stroke-dasharray="14 4" />

  <!-- Merchant Pavilion Canopy Roof -->
  <path d="M 64 96 Q 128 66 192 96 L 180 114 Q 128 88 76 114 Z" fill="url(#goldPlate)" stroke="#fff" stroke-width="1.5" />
  
  <!-- Crown Apex Diamond -->
  <polygon points="128,52 138,66 128,80 118,66" fill="#fff" stroke="url(#goldPlate)" stroke-width="2" />

  <!-- Vault Pillars -->
  <rect x="76" y="112" width="14" height="64" rx="3" fill="url(#goldPlate)" />
  <rect x="166" y="112" width="14" height="64" rx="3" fill="url(#goldPlate)" />

  <!-- Central Floating Treasure Coin -->
  <circle cx="128" cy="142" r="32" fill="url(#goldPlate)" stroke="#fff" stroke-width="2" />
  <circle cx="128" cy="142" r="23" fill="none" stroke="#8c6109" stroke-width="2" />
  <polygon points="128,126 138,142 128,158 118,142" fill="#fff" />

  <!-- Base Vault Plinth -->
  <rect x="62" y="174" width="132" height="18" rx="4" fill="url(#goldPlate)" stroke="#fff" stroke-width="1.5" />
  <line x1="72" y1="183" x2="184" y2="183" stroke="#8c6109" stroke-width="2" />
</svg>

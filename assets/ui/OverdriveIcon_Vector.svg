<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" style="background: transparent;">
  <defs>
    <filter id="fireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feFlood flood-color="#ff7043" flood-opacity="0.65" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="obsidianCrimson" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3d151c" />
      <stop offset="60%" stop-color="#1f090d" />
      <stop offset="100%" stop-color="#0c0305" />
    </radialGradient>

    <linearGradient id="firePlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082" />
      <stop offset="40%" stop-color="#ff9800" />
      <stop offset="80%" stop-color="#f44336" />
      <stop offset="100%" stop-color="#b71c1c" />
    </linearGradient>

    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fff59d" />
      <stop offset="100%" stop-color="#ffa726" />
    </linearGradient>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="128" cy="128" r="116" fill="none" stroke="#ff7043" stroke-width="6" opacity="0.4" filter="url(#fireGlow)" />

  <!-- Crimson Obsidian Base -->
  <circle cx="128" cy="128" r="110" fill="url(#obsidianCrimson)" stroke="url(#firePlate)" stroke-width="7" />

  <!-- Radiating Starburst Spires (Cardinal + Diagonal) -->
  <g fill="url(#firePlate)">
    <!-- Cardinal -->
    <polygon points="128,46 134,128 128,136 122,128" />
    <polygon points="128,210 134,128 128,120 122,128" />
    <polygon points="46,128 128,134 136,128 128,122" />
    <polygon points="210,128 128,134 120,128 128,122" />
    <!-- Diagonal -->
    <polygon points="70,70 128,124 128,132 124,128" opacity="0.8" />
    <polygon points="186,70 128,124 132,128 128,132" opacity="0.8" />
    <polygon points="70,186 124,128 128,124 128,132" opacity="0.8" />
    <polygon points="186,186 132,128 128,124 128,132" opacity="0.8" />
  </g>

  <!-- Dynamic Overdrive Lightning Bolt -->
  <polygon points="144,60 102,128 128,128 112,196 156,118 130,118" fill="url(#boltGrad)" stroke="#ffffff" stroke-width="2.5" />

  <!-- Core Nova Diamond -->
  <polygon points="128,114 136,128 128,142 120,128" fill="#ffffff" />
</svg>
